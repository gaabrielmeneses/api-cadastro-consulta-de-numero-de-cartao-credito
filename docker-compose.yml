version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: creditcard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: creditcard_db
      MYSQL_USER: creditcard_user
      MYSQL_PASSWORD: creditcard_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - creditcard-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  app:
    build: .
    container_name: creditcard-api
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: creditcard_db
      DB_USERNAME: creditcard_user
      DB_PASSWORD: creditcard_pass
      JWT_SECRET: mySecretKey123456789012345678901234567890
      ENCRYPTION_KEY: myEncryptionKey1234567890123456
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - creditcard-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s

volumes:
  mysql_data:

networks:
  creditcard-network:
    driver: bridge