services:
  mysql:
    image: mysql:8
    container_name: mysql8
    environment:
      MYSQL_ROOT_PASSWORD: cont1234
      MYSQL_DATABASE: creditcard
      MYSQL_USER: admin
      MYSQL_PASSWORD: cont1234
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: creditcard-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/creditcard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: cont1234
      SECURITY_JWT_SECRET: mySecretKey123456789012345678901234567890
      SECURITY_JWT_EXPIRATION: 3600000
      ENCRYPTION_KEY: myEncryptionKey1234567890123456
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
